name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to push the built site to the gh-pages branch.
permissions:
  contents: write

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Next 16 requires >=20.9.0; setup-node resolves "20" to the latest 20.x.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root tooling deps
        run: npm ci

      - name: Install web deps
        run: npm ci --prefix web

      - name: Lint (Biome)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      # GATE: parses data/portfolio.csv, validates the 46-column contract, regenerates
      # web/public/data + web/public/downloads, and enforces the gzipped size budget.
      # A malformed CSV fails HERE, before anything is published, so the previously
      # deployed site keeps serving the last good data (spec §3.1, §3.3).
      - name: Prepare published data (schema + size gate)
        run: npm run prep

      # Project Pages live under /abcd-publications, so the base path must be set.
      # Switching to a custom domain = set this to '' and add web/public/CNAME.
      - name: Build static export
        run: npm run build --prefix web
        env:
          NEXT_PUBLIC_BASE_PATH: /abcd-publications
          NEXT_PUBLIC_SITE_URL: https://nbdc-datahub.github.io/abcd-publications

      # web/out already contains .nojekyll (from web/public), which Pages needs so the
      # _next/ directory is not stripped by Jekyll.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          publish_branch: gh-pages
